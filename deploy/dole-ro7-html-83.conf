# Apache2 virtual host for the standalone DOLE RO7 HTML prototype.
# First ensure /etc/apache2/ports.conf has exactly one "Listen 83".
# Do not enable this alongside another default *:83 application site.
<VirtualHost *:83>
    ServerName 49.157.74.165
    DocumentRoot /var/www/dole-ro7-html
    DirectoryIndex index.html

    <Directory /var/www/dole-ro7-html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dole-ro7-html-83-error.log
    CustomLog ${APACHE_LOG_DIR}/dole-ro7-html-83-access.log combined
</VirtualHost>
